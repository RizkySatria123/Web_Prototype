<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrivision Super Admin — Tambah Administrator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/sidebar.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <header class="topnav">
    <div style="font-size:14px;color:var(--color-text-muted);">
      Super Admin · Kelola Pengguna · <strong style="color:var(--color-text-main);">Tambah Administrator</strong>
    </div>
    <div class="topnav-actions">
      <button class="topnav-icon-btn"><span class="material-symbols-outlined">notifications</span></button>
      <div class="topnav-avatar" style="background:#6d28d9;">SA</div>
    </div>
  </header>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Tambah Administrator Baru</h1>
        <p class="page-subtitle">Buat akun akses untuk tim internal Agrivision (Manager atau Super Admin tambahan).</p>
      </div>
      <button class="btn btn-ghost" onclick="window.history.back()">
        <span class="material-symbols-outlined" style="font-size:17px;">arrow_back</span>Kembali
      </button>
    </div>

    <div class="card" style="max-width:800px; margin:0 auto;">
      <div class="card-header">
        <span class="card-title">Formulir Pendaftaran Admin</span>
      </div>
      <div class="card-body">
        <form onsubmit="event.preventDefault(); alert('Administrator berhasil ditambahkan!'); window.location.href='superadmin-users.html';">
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
            <div>
              <label class="form-label">Nama Lengkap</label>
              <input type="text" class="form-input" placeholder="Masukkan nama lengkap" required>
            </div>
            <div>
              <label class="form-label">Alamat Email (Akun Agrivision)</label>
              <input type="email" class="form-input" placeholder="contoh@agrivisiontech.com" required>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
            <div>
              <label class="form-label">Pilih Role / Hak Akses</label>
              <select class="form-input form-select" required>
                <option value="" disabled selected>Pilih Role...</option>
                <option value="manager">Manager (Operasional Lahan & Klien)</option>
                <option value="superadmin">Super Admin (Akses Penuh Platform)</option>
              </select>
            </div>
            <div>
              <label class="form-label">Departemen / Divisi</label>
              <select class="form-input form-select">
                <option>Ops & Support</option>
                <option>Data Science (GIS)</option>
                <option>IT & Infrastructure</option>
                <option>Business & Sales</option>
              </select>
            </div>
          </div>

          <div style="margin-bottom:30px;">
            <label class="form-label">Password Sementara</label>
            <div style="display:flex;gap:12px;">
              <input type="text" class="form-input" value="AgriVis-2026-XyZ" readonly style="background:var(--color-surface-container-high);cursor:not-allowed;">
              <button type="button" class="btn btn-ghost" onclick="alert('Password disalin ke clipboard')"><span class="material-symbols-outlined" style="font-size:18px;">content_copy</span></button>
            </div>
            <p style="font-size:12px;color:var(--color-text-muted);margin-top:6px;">Pengguna akan diminta mengubah password pada saat login pertama kali.</p>
          </div>

          <div style="display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--color-border-muted);padding-top:20px;">
            <button type="button" class="btn btn-ghost" onclick="window.history.back()">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan & Buat Akun</button>
          </div>

        </form>
      </div>
    </div>

  </main>
</div>
<script>renderSidebar('superadmin','superadmin-users.html');</script>
</body>
</html>
